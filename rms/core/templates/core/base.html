<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}Restaurant Management System{% endblock %}</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', system-ui, sans-serif; background: #f5f5f0; color: #1a1a1a; min-height: 100vh; }

    nav { background: #1a1a2e; padding: 1rem 2rem; display: flex; align-items: center; justify-content: space-between; }
    nav .brand { color: #e8c547; font-size: 1.25rem; font-weight: 700; text-decoration: none; letter-spacing: .5px; }
    nav a.nav-link { color: #ccc; text-decoration: none; font-size: .9rem; transition: color .2s; }
    nav a.nav-link:hover { color: #e8c547; }

    .container { max-width: 900px; margin: 2.5rem auto; padding: 0 1.25rem; }

    .messages { list-style: none; margin-bottom: 1.5rem; }
    .messages li { padding: .75rem 1rem; border-radius: 6px; font-size: .9rem; margin-bottom: .5rem; }
    .messages .success { background: #d4edda; color: #155724; border-left: 4px solid #28a745; }
    .messages .error   { background: #f8d7da; color: #721c24; border-left: 4px solid #dc3545; }

    .btn { display: inline-block; padding: .5rem 1.1rem; border-radius: 6px; font-size: .875rem; font-weight: 600; text-decoration: none; cursor: pointer; border: none; transition: opacity .2s, transform .1s; }
    .btn:active { transform: scale(.97); }
    .btn-primary   { background: #e8c547; color: #1a1a2e; }
    .btn-secondary { background: #eee; color: #333; }
    .btn-danger    { background: #dc3545; color: #fff; }
    .btn-sm        { padding: .3rem .7rem; font-size: .8rem; }
    .btn:hover     { opacity: .85; }

    .card { background: #fff; border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,.08); padding: 1.5rem; margin-bottom: 1rem; }

    .form-control { width: 100%; padding: .55rem .75rem; border: 1px solid #d0d0d0; border-radius: 6px; font-size: .95rem; margin-top: .3rem; transition: border-color .2s; }
    .form-control:focus { outline: none; border-color: #e8c547; }
    p { margin-bottom: .9rem; }

    h1 { font-size: 1.75rem; margin-bottom: 1.25rem; }
    h2 { font-size: 1.2rem; margin-bottom: .5rem; }
    .stars { color: #e8c547; font-size: 1.1rem; letter-spacing: 2px; }
    .meta  { color: #888; font-size: .85rem; }
    hr     { border: none; border-top: 1px solid #eee; margin: 1.25rem 0; }
    .errorlist { color: #dc3545; font-size: .85rem; margin-top: .25rem; padding-left: 1rem; }

    /* ── Menu card styles ── */
    .menu-section { margin-bottom: 1.75rem; }
    .menu-section-title {
      font-size: .7rem; font-weight: 700; letter-spacing: 1.5px;
      text-transform: uppercase; color: #888;
      border-bottom: 2px solid #f0f0f0; padding-bottom: .4rem; margin-bottom: .75rem;
    }
    .menu-item-row {
      display: flex; align-items: center; justify-content: space-between;
      gap: 1rem; padding: .65rem 0;
      border-bottom: 1px dashed #f0f0f0;
    }
    .menu-item-row:last-child { border-bottom: none; }
    .menu-item-name { font-weight: 600; font-size: .95rem; }
    .menu-item-actions { display: flex; gap: .4rem; align-items: center; }
    .menu-price { font-weight: 700; color: #1a1a2e; white-space: nowrap; }
    .badge {
      display: inline-block; padding: .2rem .55rem; border-radius: 20px;
      font-size: .7rem; font-weight: 700; letter-spacing: .5px; text-transform: uppercase;
    }
    .badge-veg     { background: #d4edda; color: #155724; }
    .badge-non_veg { background: #f8d7da; color: #721c24; }
    .badge-vegan   { background: #d1ecf1; color: #0c5460; }
  </style>
</head>
<body>
<nav>
  <a class="brand" href="{% url 'core:restaurant_list' %}">🍽 RMS</a>
  <a class="nav-link" href="{% url 'core:restaurant_list' %}">All Restaurants</a>
</nav>
<div class="container">
  {% if messages %}
  <ul class="messages">
    {% for message in messages %}
    <li class="{{ message.tags }}">{{ message }}</li>
    {% endfor %}
  </ul>
  {% endif %}
  {% block content %}{% endblock %}
</div>
</body>
</html>
