{% extends "core/base.html" %}
{% block title %}Delete {{ item.name }} | RMS{% endblock %}

{% block content %}
<div class="card" style="max-width:500px; margin:0 auto; text-align:center; padding:2.5rem 2rem;">
  <p style="font-size:3rem; margin-bottom:1rem;">🗑</p>
  <h1 style="font-size:1.4rem; margin-bottom:.75rem;">Remove Menu Item?</h1>
  <p style="color:#555; margin-bottom:.5rem;">
    You are about to remove <strong>{{ item.name }}</strong> from
    <strong>{{ restaurant.name }}</strong>'s menu.
  </p>
  <p style="color:#dc3545; font-size:.9rem; margin-bottom:2rem;">This action cannot be undone.</p>

  <form method="POST">
    {% csrf_token %}
    <div style="display:flex; gap:.75rem; justify-content:center;">
      <button type="submit" class="btn btn-danger">Yes, Remove It</button>
      <a href="{% url 'core:restaurant_detail' restaurant.pk %}" class="btn btn-secondary">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
